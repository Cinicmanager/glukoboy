; Глюкобой. UTF-8. После изменений перезапустите программу.
; Случайный интервал после атаки: от 1 до 1440 минут.
IntervalMin=15
IntervalMax=20
; Число заданий за атаку: 4–6, всегда два диктанта. Можно указать одинаковые границы.
TaskMin=4
TaskMax=6
; Одна сложность: 1 класс, вторая четверть. Старые Grade и Level игнорируются.
; MathMax действует только в 1 классе, от 3 до 10; шаги 1–3.
MathMax=10
; Ночь по местному времени, формат ЧЧ:ММ.
NightFrom=21:00
NightTo=07:00
; Свободное утро: атак по таймеру нет, компьютер работает как обычно.
; Одинаковое время (например 07:00 и 07:00) — выключить.
FreeFrom=07:00
FreeTo=09:00
; Пора в школу: экран-блокировка по будням. Одинаковое время — выключить.
; SchoolDays — дни недели цифрами: 1 — понедельник … 7 — воскресенье.
SchoolFrom=08:20
SchoolTo=09:00
SchoolDays=12345
; Атака уходит сама, если столько минут не трогать клавиатуру и мышь. 0 — выключить.
IdleLeave=60
; Ночные сюжеты: overheat — перегрев, repair — ремонт, cleanup — очистка, update — обновление.
; Можно оставить только NightModes=overheat. Сюжет меняется раз в сутки.
NightModes=overheat,repair,cleanup,update
; Анимация: 0 — минимум движения, 1 — обычная, 2 — активная.
AnimationLevel=1
; 1 — первая дневная атака через 10 секунд, следующие через минуту.
; Ночь и свободное утро действуют и в тестовом режиме.
TestMode=0
