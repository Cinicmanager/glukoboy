; Глюкобой. UTF-8. После изменений перезапустите программу.
; Случайный интервал после атаки: от 1 до 1440 минут.
IntervalMin=15
IntervalMax=20
; Число заданий за атаку: 3 или 4. Можно указать одинаковые границы.
TaskMin=3
TaskMax=4
; Grade — класс 1..3. Задания 2–3 класса включаются здесь.
Grade=1
; Level — уровень 1..3 внутри выбранного класса. Родитель повышает вручную.
Level=1
; MathMax действует только в 1 классе, от 3 до 10; шаги 1–3.
MathMax=10
; Ночь по местному времени, формат ЧЧ:ММ.
NightFrom=21:00
NightTo=07:00
; Свободное утро: атак по таймеру нет, компьютер работает как обычно.
; Одинаковое время (например 07:00 и 07:00) — выключить.
FreeFrom=07:00
FreeTo=09:00
; Пора в школу: экран-блокировка по будням. Одинаковое время — выключить.
; SchoolDays — дни недели цифрами: 1 — понедельник … 7 — воскресенье.
SchoolFrom=08:20
SchoolTo=09:00
SchoolDays=12345
; 1 — первая дневная атака через 10 секунд, следующие через минуту.
; Ночь и свободное утро действуют и в тестовом режиме.
TestMode=0
